<script>
(function(){
'use strict';
// ==========================================
// 王金武快跑 - 云存档系统 (Supabase)
// ==========================================
const SUPABASE_URL = 'https://qykeychotxmfvfgwaeqy.supabase.co';
const SUPABASE_KEY = 'sb_publishable_GtHkA2LPUvYIyJRMEaaeww_yXijdPVV';
let currentUserId = null;
let _saveInFlight = false;

// 1. 真实联网登录/注册逻辑
window.authUser = async function(isRegister) {
  const userInp = document.getElementById('inpUser').value.trim();
  const passInp = document.getElementById('inpPass').value.trim();
  if (!userInp || !passInp) return alert('请输入账号和密码');

  const email = userInp + '@wjw.com';
  const endpoint = isRegister ? 'signup' : 'token?grant_type=password';

  try {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/${endpoint}`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ email, password: passInp })
    });

    const data = await res.json();
    if (!res.ok) {
      return alert(data.error_description || data.msg || '操作失败，请检查网络');
    }

    if (isRegister) {
      alert('注册成功，请点击登录！');
    } else {
      currentUserId = data.user.id;
      localStorage.setItem('wjw_token', data.access_token);
      localStorage.setItem('wjw_refresh', data.refresh_token || '');
      localStorage.setItem('wjw_uid', data.user.id);
      alert('登录成功！正在同步云存档...');
      await loadCloudSave();
    }
  } catch (err) {
    alert('网络请求失败，请检查是否跨域');
    console.error(err);
  }
};

window.localAuth = window.authUser;
// 2. 把云端数据应用到游戏
function applyCloudSave(d) {
  if (!d || typeof d !== 'object') return;
  G.totalCoins = d.totalCoins ?? 0;
  G.best = d.best ?? 0;
  G.stats = Object.assign(G.stats, d.stats || {});
  G.upgrades = Object.assign(G.upgrades, d.upgrades || {});
  UPGRADES.forEach(u => {
    if (typeof G.upgrades[u.id] !== 'number') G.upgrades[u.id] = 0;
    G.upgrades[u.id] = clamp(G.upgrades[u.id], 0, u.maxLv);
  });

  G.owned = Array.isArray(d.owned) && d.owned.length
    ? d.owned.filter(id => CHARS.some(c => c.id === id))
    : ['mdf'];
  if (!G.owned.includes('mdf')) G.owned.unshift('mdf');
  G.selected = (d.selected && G.owned.includes(d.selected)) ? d.selected : 'mdf';

  G.ownedSkins = Array.isArray(d.ownedSkins) ? d.ownedSkins.slice() : [];
  G.charSkins = Object.assign({}, d.charSkins || {});
  CHARS.forEach(c => {
    const def = c.id + '_default';
    if (!G.ownedSkins.includes(def)) G.ownedSkins.push(def);
    const cur = G.charSkins[c.id];
    if (!cur || !G.ownedSkins.includes(cur)) G.charSkins[c.id] = def;
  });

  G.ownedPets = Array.isArray(d.ownedPets) && d.ownedPets.length
    ? d.ownedPets.filter(id => PETS.some(p => p.id === id))
    : ['none'];
  if (!G.ownedPets.includes('none')) G.ownedPets.unshift('none');
  G.petId = (d.petId && G.ownedPets.includes(d.petId)) ? d.petId : 'none';

  G.wishCoins = d.wishCoins ?? 0;
  G.mythCrystal = d.mythCrystal ?? 0;
  G.mythShard = d.mythShard ?? 0;
  G.coinRushDate = d.coinRushDate || '';

  G.weathersSeen = Array.isArray(d.weathersSeen) ? d.weathersSeen.slice() : [];
  G.stats.weathersSeen = G.weathersSeen.length;

  G.achClaimed = Array.isArray(d.achClaimed) ? d.achClaimed.slice() : [];
  G.achSeen = Array.isArray(d.achSeen) ? d.achSeen.slice() : [];

  G.mapsUsed = Array.isArray(d.mapsUsed)
    ? d.mapsUsed.filter(id => MAPS.some(m => m.id === id))
    : [];
  G.stats.mapsUsed = G.mapsUsed.length;
  G.mapId = (d.mapId && MAPS.some(m => m.id === d.mapId)) ? d.mapId : 'city';
  if (!G.mapsUsed.includes(G.mapId)) G.mapsUsed.push(G.mapId);

  if (d.daily && d.daily.date === todayStr() && DAILY_POOL.some(p => p.id === d.daily.id)) {
    G.daily = { date: d.daily.date, id: d.daily.id, done: !!d.daily.done, claimed: !!d.daily.claimed };
  } else {
    const p = DAILY_POOL[Math.floor(Math.random() * DAILY_POOL.length)];
    G.daily = { date: todayStr(), id: p.id, done: false, claimed: false };
  }

  G.stats.charsOwned = G.owned.length;
  G.stats.skinsOwned = G.ownedSkins.filter(s => !s.endsWith('_default')).length;
  G.stats.petsOwned = G.ownedPets.length;
  clearCC();
}

function enterGame() {
  const layer = document.getElementById('loginLayer');
  if (layer) layer.style.display = 'none';
  G.mode = 'lobby';
  resetPlayerState();
  startFriendMqtt();
  if (!G.nickname) {
    setTimeout(() => {
      const n = prompt('给自己取个名字（好友和联机都会显示，最多 8 字）：', '跑者');
      if (n && n.trim()) {
        G.nickname = n.trim().slice(0, 8);
        markDirty(); saveProgress();
      }
    }, 350);
  }
}
window.guestLogin = function() {
  currentUserId = null;
  localStorage.removeItem('wjw_token');
  localStorage.removeItem('wjw_uid');
  localStorage.removeItem('wjw_username');
  localStorage.removeItem('wjw_refresh');
  loadProgress();
  enterGame();
};

// ===== MQTT 联机 (带准备和地图同步) =====
let mqttClient = null;
let mpActive = false;
let currentRoomId = '';
const mpPeers = {};
let mpLastBroadcast = 0;
const MP_INTERVAL = 100;
const MQTT_BROKER = 'wss://broker.emqx.io:8084/mqtt';

// 联机大厅状态
let mpMyReady = false;
let mpHostId = '';
let mpStartCountdown = 0; // 0表示未开始，>0表示倒计时中
let mpResult = null;      // null: 进行中, 'win': 你赢了, 'lose': 对手赢了
let mpTargetDist = 10000; // 终点线：10000 distance = 1000 米
let mpLastDiff = 0;       // 记录上次距离差，用来检测超车
let mpMyJoinTime = 0;     // 自己进入房间的时间戳
let mpHostConfirmed = false;  // 是否已确定房主

function joinMultiplayer(roomId) {
  if (mqttClient || !roomId) return;
  currentRoomId = String(roomId).trim();
  if (!currentRoomId) return;

  const myId = 'wjw_' + Math.random().toString(16).slice(2, 10);
  mqttClient = mqtt.connect(MQTT_BROKER, {
    clientId: myId,
    clean: true,
    reconnectPeriod: 3000,
    connectTimeout: 10000
  });
  mqttClient._myId = myId;

  mqttClient.on('connect', () => {
  mqttClient.subscribe('wjw-runner-v1/' + currentRoomId);
  mpActive = true;
  mpMyReady = false;
  mpStartCountdown = 0;
  mpHostId = '';
  mpHostConfirmed = false;
  mpMyJoinTime = Date.now();
  for (const id in mpPeers) delete mpPeers[id];

  G.mode = 'mp_lobby';

  mqttClient.publish('wjw-runner-v1/' + currentRoomId, JSON.stringify({
    type: 'join',
    userId: myId,
    name: G.nickname || '跑者',
    mapId: G.mapId,
    joinTime: mpMyJoinTime
  }));

  // 1.5 秒后以"最早进入者"为房主
  setTimeout(() => {
    if (!mpActive || G.mode !== 'mp_lobby' || mpHostConfirmed) return;
    let earliestId = mqttClient._myId;
    let earliestTime = mpMyJoinTime;
    for (const pid in mpPeers) {
      const pt = mpPeers[pid].joinTime;
      if (pt && pt < earliestTime) { earliestTime = pt; earliestId = pid; }
    }
    mpHostId = earliestId;
    mpHostConfirmed = true;
    if (mpHostId === mqttClient._myId) {
      mqttClient.publish('wjw-runner-v1/' + currentRoomId, JSON.stringify({
        type: 'sync_map',
        userId: mqttClient._myId,
        mapId: G.mapId,
        name: G.nickname || '房主'
      }));
    }
    checkMpStart();
  }, 1500);
});

mqttClient.on('message', (topic, payload) => {
  try {
    const data = JSON.parse(payload.toString());
    if (!data || !data.userId || data.userId === mqttClient._myId) return;
    const peerId = data.userId;

    if (!mpPeers[peerId]) {
      mpPeers[peerId] = { name: data.name || '对手', ready: false, joinTime: data.joinTime || 0 };
    } else {
      if (data.name) mpPeers[peerId].name = data.name;
      if (data.joinTime && data.joinTime < (mpPeers[peerId].joinTime || Infinity)) {
        mpPeers[peerId].joinTime = data.joinTime;
      }
    }

    if (data.type === 'join') {
      // 回一个 join，让新来的知道我是谁
      mqttClient.publish('wjw-runner-v1/' + currentRoomId, JSON.stringify({
        type: 'join',
        userId: mqttClient._myId,
        name: G.nickname || '跑者',
        mapId: G.mapId,
        joinTime: mpMyJoinTime
      }));
    }
    else if (data.type === 'sync_map') {
      if (data.mapId) G.mapId = data.mapId;
    }
    else if (data.type === 'ready') {
      mpPeers[peerId].ready = !!data.ready;
      checkMpStart();
    }
    else if (data.type === 'start') {
      if (G.mode === 'mp_lobby' && mpStartCountdown <= 0) {
        mpStartCountdown = 3.9;
        if (data.seed) initSeed(data.seed);
        if (data.weatherId) {
          G.weatherId = data.weatherId;
          if (!G.weathersSeen.includes(G.weatherId)) {
            G.weathersSeen.push(G.weatherId);
            G.stats.weathersSeen = G.weathersSeen.length;
          }
        }
      }
    }
    else if (data.type === 'state') {
      if (G.mode === 'playing' || G.mode === 'endless') {
        mpPeers[peerId] = Object.assign(mpPeers[peerId] || {}, data);
      }
    }
    else if (data.type === 'finish') {
      if (mpResult === null && G.mode === 'playing') {
        mpResult = 'lose';
        G.mode = 'mp_result';
        G.milestoneMsg = '😢 对手先到了！';
      }
    }
    else if (data.type === 'leave') {
      delete mpPeers[peerId];
    }
  } catch (e) {}
});
}

function mpToggleReady() {
  if (!mqttClient || !mqttClient.connected || mpStartCountdown > 0) return;
  mpMyReady = !mpMyReady;
  mqttClient.publish('wjw-runner-v1/' + currentRoomId, JSON.stringify({
    type: 'ready',
    userId: mqttClient._myId,
    ready: mpMyReady,
    name: G.nickname || '跑者'
  }));
  if (mpMyReady) checkMpStart();
}

function checkMpStart() {
  if (G.mode !== 'mp_lobby') return;
  if (mpStartCountdown > 0) return;
  if (!mpHostConfirmed) return;
  if (!mqttClient || mpHostId !== mqttClient._myId) return;  // 仅房主发起

  const peerCount = Object.keys(mpPeers).length;
  if (peerCount === 0) return;

  let allReady = mpMyReady;
  for (const id in mpPeers) {
    if (!mpPeers[id].ready) allReady = false;
  }

  if (allReady) {
    mpStartCountdown = 3.9;
    const mySeed = String(Date.now()) + Math.random();
    initSeed(mySeed);
    pickWeather();
    mqttClient.publish('wjw-runner-v1/' + currentRoomId, JSON.stringify({
      type: 'start',
      userId: mqttClient._myId,
      seed: mySeed,
      weatherId: G.weatherId
    }));
  }
}

function broadcastMyState() {
  if (!mpActive || !mqttClient || !mqttClient.connected) return;
  if (G.mode !== 'playing' && G.mode !== 'endless') return;
  const now = Date.now();
  if (now - mpLastBroadcast < MP_INTERVAL) return;
  mpLastBroadcast = now;

  mqttClient.publish('wjw-runner-v1/' + currentRoomId, JSON.stringify({
    type: 'state',
    userId: mqttClient._myId,
    x: P.x + P.dashOffset,
    y: P.y,
    distance: G.distance,
    charId: G.selected,
    isSliding: P.sliding,
    isFlying: P.flying,
    name: G.nickname || getChar().name || '跑者'
  }));
}

function leaveMultiplayer() {
  if (!mqttClient) return;
  try {
    if (mqttClient.connected) {
      mqttClient.publish('wjw-runner-v1/' + currentRoomId, JSON.stringify({
        type: 'leave',
        userId: mqttClient._myId
      }));
    }
    mqttClient.end(true);
  } catch (e) {}
  mqttClient = null;
  mpActive = false;
  mpMyReady = false;
  currentRoomId = '';
  for (const id in mpPeers) delete mpPeers[id];
  G.mode = 'lobby';
}

// 幽灵渲染（保持不变）
function drawGhostPlayers() {
  if (!mpActive) return;
  if (G.mode !== 'playing') return;

  const myDist = G.distance;
  
  // 2. 判断胜负（自己是否到达终点）
  if (myDist >= mpTargetDist && mpResult === null) {
    mpResult = 'win';
    G.mode = 'mp_result';
    if (mqttClient && mqttClient.connected) {
      mqttClient.publish('wjw-runner-v1/' + currentRoomId, JSON.stringify({
        type: 'finish',
        userId: mqttClient._myId
      }));
    }
  }

  // 3. 画对手幽灵
  for (const userId in mpPeers) {
  const peer = mpPeers[userId];
  if (!peer || !peer.distance) continue;

  const peerDiff = peer.distance - myDist;
  const clamped = Math.max(-300, Math.min(300, peerDiff));
    let screenX = PLAYER_X + (clamped / 300) * 250; 
    const screenY = Math.max(GROUND_Y - 260, Math.min(GROUND_Y, peer.y));

    ctx.save();
    ctx.globalAlpha = 0.5;
    const oldP = { x: P.x, y: P.y, sliding: P.sliding, flying: P.flying, onGround: P.onGround, vy: P.vy, dashOffset: P.dashOffset, squash: P.squash, jumps: P.jumps, coyote: P.coyote, slideT: P.slideT, slideMaxT: P.slideMaxT, rot: P.rot, runPhase: P.runPhase, dashing: P.dashing };
    P.x = screenX; P.y = peer.y; P.sliding = !!peer.isSliding; P.flying = !!peer.isFlying; P.onGround = !peer.isFlying && Math.abs(peer.y - GROUND_Y) < 2;
    P.vy = 0; P.dashOffset = 0; P.squash = 1; P.jumps = 0; P.coyote = 0; P.slideT = 0; P.slideMaxT = 0; P.rot = 0; P.runPhase = G.time * 8; P.dashing = false;

    const ghostChar = getCharById(peer.charId || 'mdf');
    drawCharacterBody(ghostChar, P.runPhase, P.sliding, P.flying);
    
    P.x = oldP.x; P.y = oldP.y; P.sliding = oldP.sliding; P.flying = oldP.flying; P.onGround = oldP.onGround; P.vy = oldP.vy; P.dashOffset = oldP.dashOffset; P.squash = oldP.squash; P.jumps = oldP.jumps; P.coyote = oldP.coyote; P.slideT = oldP.slideT; P.slideMaxT = oldP.slideMaxT; P.rot = oldP.rot; P.runPhase = oldP.runPhase; P.dashing = oldP.dashing;

    ctx.globalAlpha = 0.9;
    ctx.font = 'bold 12px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillStyle = 'rgba(200,235,255,0.95)';
    ctx.fillText(peer.name || '对手', screenX, peer.y - 85);
    ctx.restore();
  }

  // 4. 顶部双轨进度条
if (Object.keys(mpPeers).length > 0) {
  const peer = mpPeers[Object.keys(mpPeers)[0]];
  const peerDist = peer.distance || 0;
  const diff = peerDist - myDist;

  // 超车提示
  if (mpLastDiff !== 0) {
    if (mpLastDiff < 0 && diff >= 0) { G.milestoneMsg = '⚡ 超车！你领先了！'; G.milestoneMsgT = 1.5; }
    if (mpLastDiff > 0 && diff <= 0) { G.milestoneMsg = '⚠️ 被超了！快追！'; G.milestoneMsgT = 1.5; }
  }
  mpLastDiff = diff;

        // 画进度条
    const barY = 160, barW = W - 80, barX = 40;
    ctx.save();
    // 底槽
    ctx.fillStyle = 'rgba(8,14,32,0.8)';
    roundRect(barX, barY, barW, 8, 4); ctx.fill();
    
    // 我的进度（蓝色）
    const myRatio = Math.min(1, myDist / mpTargetDist);
    ctx.fillStyle = '#7ee0ff';
    roundRect(barX, barY, barW * myRatio, 4, 2); ctx.fill();
    
    // 对手进度（红色）
    const peerRatio = Math.min(1, peerDist / mpTargetDist);
    ctx.fillStyle = '#ff5c7a';
    roundRect(barX, barY + 4, barW * peerRatio, 4, 2); ctx.fill();
    
    // 终点旗
    ctx.font = '16px ' + FONT; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
    ctx.fillText('🏁', barX + barW + 10, barY + 8);
    ctx.restore();
    
    // ===== 新增：速度状态提示 =====
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 14px ' + FONT;
    
    if (G.dashSpeedT > 0) {
      ctx.fillStyle = '#ffb84d'; ctx.shadowColor = '#ffb84d'; ctx.shadowBlur = 10;
      ctx.fillText('⚡ 极速冲刺 ' + Math.ceil(G.dashSpeedT) + 's', W/2, barY + 30);
    } else if (diff < -200) {
      ctx.fillStyle = '#9fe0ff'; // 领先
      ctx.fillText('🏃‍♂️ 领跑者（速度微降）', W/2, barY + 30);

let friendMqtt=null;
const pendingFriendReqs=[];

// ===== 全服排行榜 (终极版) =====
let globalScores = {};
try { globalScores = JSON.parse(localStorage.getItem('wjw_global_rank') || '{}'); } catch(e) {}

function updateGlobalRank(data) {
  if (!data.playerId || typeof data.score !== 'number' || data.score <= 0) return;
  
  // 【防作弊】分数不能超过 10 万米，超过的一律当外挂处理
  if (data.score > 100000) return;
  
  const old = globalScores[data.playerId];
  // 只有分数更高才更新
  if (!old || data.score > old.score) {
    globalScores[data.playerId] = {
      name: data.name || '跑者',
      score: data.score,
      time: Date.now()
    };
  } else {
    old.time = Date.now(); // 活跃时间更新
    if (data.name && data.name !== old.name) old.name = data.name; // 改名同步
  }
  
  // 本地最多保留 100 个玩家，防止缓存爆满
  const keys = Object.keys(globalScores);
  if (keys.length > 100) {
    const sorted = keys.map(k => ({ id: k, score: globalScores[k].score })).sort((a,b) => a.score - b.score);
    for (let i = 0; i < 20; i++) delete globalScores[sorted[i].id]; // 删掉最低分的 20 个人
  }
  
  try { localStorage.setItem('wjw_global_rank', JSON.stringify(globalScores)); } catch(e) {}
}

async function broadcastGlobalScore() {
  const myScore = G.best || 0;
  if (myScore <= 0) return;
  
  // 如果连了网，直接存到数据库（无账号也能上传，用本地ID）
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/leaderboard?on_conflict=player_id`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates'
      },
      body: JSON.stringify({
        player_id: G.playerId,
        name: G.nickname || '跑者',
        score: myScore,
        char_id: G.selected
      })
    });
  } catch (e) { console.log('排行榜上传失败', e); }
  
  // 为了兼容旧版，依然向 MQTT 喊一声（不用管）
  if (!friendMqtt || !friendMqtt.connected) return;
  friendMqtt.publish('wjw-global-rank-v1', JSON.stringify({
    playerId: G.playerId || 'unknown',
    name: G.nickname || '跑者',
    score: myScore
  }));
}

function startFriendMqtt(){
  if(friendMqtt||!G.playerId)return;
  friendMqtt=mqtt.connect(MQTT_BROKER,{
    clientId:'wjwf_'+Math.random().toString(16).slice(2,10),
    clean:true,
    reconnectPeriod:4000,
    connectTimeout:10000
  });

  friendMqtt.on('connect',()=>{
  friendMqtt.subscribe('wjw-friend-req/'+G.playerId);
  friendMqtt.subscribe('wjw-global-rank-v1'); // 订阅全服排行榜
  console.log('好友/排行通道已连接，ID:',G.playerId);
  broadcastGlobalScore(); // 上线就广播一次自己的分数
});

  friendMqtt.on('message',(topic,payload)=>{
    try{
  const d=JSON.parse(payload.toString());
  
  // 接收排行榜消息
if(topic==='wjw-global-rank-v1'){
  updateGlobalRank(d);
  // 如果收到别人的分数，而自己现在在大厅或排行榜，就顺手把自己的最新分数也发一次，保证榜单同步
  if(G.mode === 'lobby' || G.mode === 'global_rank') {
    broadcastGlobalScore();
  }
  return;
}

  if(!d||!d.type||!d.fromId)return;
      if(d.type==='request'){
        if(G.friends.some(f=>f.playerId===d.fromId))return;
        if(pendingFriendReqs.some(r=>r.fromId===d.fromId))return;
        pendingFriendReqs.push(d);
        showFriendRequest(d);
      }else if(d.type==='accept'){
        const already=G.friends.some(f=>f.playerId===d.fromId);
        if(already)return;
        G.friends.unshift({
          name:d.name||'跑者',
          best:d.best||0,
          charId:d.charId||'mdf',
          skinId:d.skinId||'',
          ts:Date.now(),
          playerId:d.fromId
        });
        if(G.friends.length>20)G.friends.length=20;
        markDirty();saveProgress();
        G.milestoneMsg='✅ '+(d.name||'对方')+' 已接受你的好友申请';
        G.milestoneMsgT=2.5;
      }
    }catch(e){}
  });

  friendMqtt.on('error',(e)=>console.warn('好友申请 MQTT 错误',e));
}

function showFriendRequest(d){
  const ok=confirm((d.name||'对方')+'（最高 '+(d.best||0)+' 米）\n请求添加你为好友，接受吗？');
  const idx=pendingFriendReqs.findIndex(r=>r.fromId===d.fromId);
  if(idx>=0)pendingFriendReqs.splice(idx,1);

  if(!ok)return;

  if(!G.friends.some(f=>f.playerId===d.fromId)){
    G.friends.unshift({
      name:d.name||'跑者',
      best:d.best||0,
      charId:d.charId||'mdf',
      skinId:d.skinId||'',
      ts:Date.now(),
      playerId:d.fromId
    });
    if(G.friends.length>20)G.friends.length=20;
    markDirty();saveProgress();
  }

  if(friendMqtt&&friendMqtt.connected){
    friendMqtt.publish('wjw-friend-req/'+d.fromId,JSON.stringify({
      type:'accept',
      fromId:G.playerId,
      name:G.nickname||'跑者',
      best:G.best||0,
      charId:G.selected,
      skinId:G.charSkins[G.selected]||''
    }));
  }
}

function sendFriendRequest(targetId){
  if(!friendMqtt||!friendMqtt.connected){
    alert('好友申请通道未连接，请检查网络后重试');
    return;
  }
  const tid=String(targetId||'').trim().toUpperCase();
  if(!/^WJW[A-Z0-9]{6}$/.test(tid)){
    alert('玩家 ID 格式不对，应该是 WJW 加 6 位字母数字');
    return;
  }
  if(tid===G.playerId){
    alert('不能加自己为好友');
    return;
  }
  if(G.friends.some(f=>f.playerId===tid)){
    alert('你们已经是好友了');
    return;
  }
  friendMqtt.publish('wjw-friend-req/'+tid,JSON.stringify({
    type:'request',
    fromId:G.playerId,
    name:G.nickname||'跑者',
    best:G.best||0,
    charId:G.selected,
    skinId:G.charSkins[G.selected]||''
  }));
  alert('申请已发送，等待对方接受（对方需要在线）');
}

// 3. 拉取云存档
async function loadCloudSave() {
  const token = localStorage.getItem('wjw_token');
  const uid = localStorage.getItem('wjw_uid');
  if (!token || !uid) {
    loadProgress();
    const l = document.getElementById('loginLayer');
    if (l) l.style.display = 'flex';
    return;
  }
  currentUserId = uid;

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/saves?user_id=eq.${uid}`, {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${token}`
      }
    });

    if (!res.ok) {
      throw new Error('拉取存档失败 HTTP ' + res.status);
    }

    const rows = await res.json();

    if (Array.isArray(rows) && rows.length > 0 && rows[0].save_data) {
      applyCloudSave(rows[0].save_data);
      saveProgressOld();
    } else {
      // 云端无存档：先读取本地存档，再上传合并
      loadProgress();
      saveProgressOld();
      saveProgress();
    }

    enterGame();
  } catch (err) {
    console.error(err);
    localStorage.removeItem('wjw_token');
    localStorage.removeItem('wjw_uid');
    localStorage.removeItem('wjw_refresh');
    currentUserId = null;
    // 回退本地存档进入游戏
    loadProgress();
    enterGame();
  }
}

function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];

let wParts=[];
function newWeatherPart(type){
  const x=rand(-20,W+20),y=rand(-40,-5);
  if(type==='rain')return{x,y,vx:-80,vy:520,len:rand(10,22),c:'rgba(180,210,255,0.72)'};
  if(type==='snow')return{x,y:rand(-20,H),vx:rand(-30,30),vy:rand(40,90),r:rand(1.6,3.4),c:'rgba(255,255,255,0.9)'};
  if(type==='petal')return{x,y,vx:rand(-60,-20),vy:rand(30,70),r:rand(2.6,4.6),c:Math.random()<0.5?'rgba(255,176,208,0.92)':'rgba(255,220,240,0.92)'};
  if(type==='wind')return{x,y:rand(0,H),vx:rand(320,540),vy:rand(-12,12),len:rand(20,54),c:'rgba(200,230,255,0.35)'};
  if(type==='storm')return{x,y,vx:rand(-150,-40),vy:rand(720,920),len:rand(14,28),c:'rgba(160,200,255,0.92)'};
  return{x,y,vx:0,vy:0,r:2,c:'#fff'};
}
function updateWeatherFx(dt){
  const inRun=G.mode==='playing'||G.mode==='boss'||G.mode==='coin'||G.mode==='dead'||G.mode==='bossdead'||G.mode==='coindone'||G.mode==='endless'||G.mode==='endlessdead'||G.mode==='sd'||G.mode==='sddead';
  if(!inRun){wParts.length=0;if(G.weatherFlash>0)G.weatherFlash=0;return;}
  const w=getWeather();
  const q=PERF.weatherRate;
  const tgt=Math.round((w.particle==='rain'?90:w.particle==='snow'?46:w.particle==='petal'?30:w.particle==='wind'?22:w.particle==='storm'?140:0)*q);
  while(wParts.length<tgt)wParts.push(newWeatherPart(w.particle));
  while(wParts.length>tgt)wParts.pop();
  for(let i=0;i<wParts.length;i++){
    const p=wParts[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.y>H+30||p.x<-60||p.x>W+60)wParts[i]=newWeatherPart(w.particle);
  }
  if(w.lightning){
    if(Math.random()<dt*0.6){G.weatherFlash=0.55;beep(60,0.4,'sawtooth',0.05,30);}
    if(G.weatherFlash>0)G.weatherFlash-=dt*1.8;
  }else G.weatherFlash=0;
}
function drawWeatherOverlay(){
  const w=getWeather();
  if(PERF.lowEnd&&w.id==='fog'){ctx.fillStyle='rgba(210,220,235,0.28)';ctx.fillRect(0,0,W,H);return;}
  if(w.particle==='rain'||w.particle==='storm'){
    ctx.strokeStyle=w.particle==='storm'?'rgba(160,200,255,0.92)':'rgba(180,210,255,0.72)';
    ctx.lineWidth=1.6;ctx.beginPath();
    for(const p of wParts){ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.len*0.25,p.y+p.len);}
    ctx.stroke();
  }else if(w.particle==='snow'||w.particle==='petal'){
    for(const p of wParts){ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
  }else if(w.particle==='wind'){
    ctx.strokeStyle='rgba(200,230,255,0.4)';ctx.lineWidth=1.6;ctx.beginPath();
    for(const p of wParts){ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.len,p.y);}
    ctx.stroke();
  }
  if(w.id==='fog'){ctx.fillStyle='rgba(210,220,235,0.34)';ctx.fillRect(0,0,W,H);}
  if(G.weatherFlash>0){ctx.fillStyle='rgba(220,220,255,'+Math.min(0.4,G.weatherFlash*0.5)+')';ctx.fillRect(0,0,W,H);}
}
function roundRect(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function update(dt){
  tickSave(dt);
  // ===== 联机准备倒计时（统一在 update 推进，保证 mp_lobby 也生效）=====
  if (mpStartCountdown > 0) {
    mpStartCountdown -= dt;
    if (mpStartCountdown <= 0) {
      mpStartCountdown = 0;
      G.mapId = 'city';
      startGame(true);       // keepWeather=true，保留房主下发的天气
      mpResult = null;
      mpLastDiff = 0;
    }
    G.time += dt;
    updateParticles(dt);
    return;
  }
  if(G.mode==='duel'){updateDuel(dt);return;}
  if(G.mode==='boss'||G.mode==='bossdead'){updateBoss(dt);return;}
  if(G.mode==='coin'||G.mode==='coindone'){updateCoinRush(dt);return;}
  if(G.mode==='sd'||G.mode==='sddead'){updateSpeedDemon(dt);return;}
  G.time+=dt;
  updateWeatherFx(dt);
  if(G.shake>0.4){G.shake*=Math.pow(0.015,dt);if(G.shake<0.4)G.shake=0;}else G.shake=0;
  // 自动同步排行榜（每 15 秒）
if(G.mode==='lobby' || G.mode==='global_rank') {
  if (!window._lastRankSync) window._lastRankSync = 0;
  if (Date.now() - window._lastRankSync > 15000) {
    window._lastRankSync = Date.now();
    broadcastGlobalScore();
  }
}

if(G.mode==='lobby'){
  P.runPhase+=dt*7.2;
  
    G.lobbyGlow+=dt;
    const d=120*dt;G.scroll+=d;G.bg1+=d*0.05;G.bg2+=d*0.18;G.bg3+=d*0.42;
    if(Math.random()<dt*8)addParticle(270+rand(-70,70),440+rand(-8,8),rand(-14,14),rand(-70,-22),rand(0.6,1.4),Math.random()<0.5?'rgba(126,224,255,0.55)':'rgba(255,110,175,0.45)',rand(1.5,3.5),-14);
    const map=getMap();
    if(map.ambient&&Math.random()<dt*22*PERF.envRate)spawnAmbientParticle(map);
    updateParticles(dt);return;
  }
  if(G.mode==='map'||G.mode==='shop'||G.mode==='grow'){
    const d=(G.mode==='grow'?50:80)*dt;
    G.scroll+=d;G.bg1+=d*0.05;G.bg2+=d*0.18;G.bg3+=d*0.42;
    if(G.shopMsgT>0)G.shopMsgT-=dt;
    if(G.chestMsgT>0)G.chestMsgT-=dt;
    if(G.mode==='shop'){for(let i=G.shopFx.length-1;i>=0;i--){G.shopFx[i].t-=dt;if(G.shopFx[i].t<=0)G.shopFx.splice(i,1);}}
    if(G.mode==='grow'){
      for(let i=G.growFx.length-1;i>=0;i--){G.growFx[i].t-=dt;if(G.growFx[i].t<=0)G.growFx.splice(i,1);}
      for(let i=G.chestFx.length-1;i>=0;i--){G.chestFx[i].t-=dt;if(G.chestFx[i].t<=0)G.chestFx.splice(i,1);}
      if(G.growthTab==='achievement')G.growScroll=clamp(G.growScroll,0,getMaxGrowScroll());else G.growScroll=0;
    }
    updateParticles(dt);return;
  }
  if(G.mode==='dead'||G.mode==='endlessdead'){
    G.deadT+=dt;
    P.vy+=GRAVITY*dt;P.y+=P.vy*dt;
    if(P.y>=GROUND_Y){P.y=GROUND_Y;P.vy=0;}

    const d=90*dt;G.scroll+=d;G.bg1+=d*0.05;G.bg2+=d*0.18;G.bg3+=d*0.42;
    const map=getMap();
    if(map.ambient&&Math.random()<dt*16*PERF.envRate)spawnAmbientParticle(map);
    updateParticles(dt);return;
  }
  if(G.mode!=='playing'&&G.mode!=='endless')return;
  const ch=getChar(),map=getMap();
  if(G.flightCD>0)G.flightCD-=dt;if(G.flightCD<0)G.flightCD=0;
  if(G.reviveCD>0)G.reviveCD-=dt;if(G.reviveCD<0)G.reviveCD=0;
  if(G.jufeiCD>0)G.jufeiCD-=dt;if(G.jufeiCD<0)G.jufeiCD=0;
  if(G.zycCD>0)G.zycCD-=dt;if(G.zycCD<0)G.zycCD=0;
  if(G.dashSpeedT>0)G.dashSpeedT-=dt;if(G.dashSpeedT<0)G.dashSpeedT=0;
  if(P.dashOffset>0&&!P.dashing)P.dashOffset=Math.max(0,P.dashOffset-500*dt);
  if(P.slideCD>0)P.slideCD-=dt;if(P.slideCD<0)P.slideCD=0;
  if(G.soulCD>0)G.soulCD-=dt;if(G.soulCD<0)G.soulCD=0;
  if(G.soulActive){
    G.soulT-=dt;
    if(Math.random()<dt*30){
      addParticle(P.x+rand(-22,22),P.y-rand(6,66),rand(-40,40),rand(-100,-30),rand(0.3,0.7),Math.random()<0.5?'#7eb0ff':'#c0e0ff',rand(1.5,3.5),-40);
    }
    if(G.soulT<=0){
      G.soulActive=false;G.shield=1;G.rushT=5;G.invulnT=Math.max(G.invulnT,2);G.shake=12;
      G.milestoneMsg='✨ 灵体归来！护盾 + 加速 5 秒';G.milestoneMsgT=2.2;
      beep(880,0.15,'triangle',0.06,1400);
      setTimeout(()=>beep(1180,0.2,'triangle',0.06,1700),120);
      for(let i=0;i<44;i++){
        const a=(i/44)*Math.PI*2;
        addParticle(P.x,P.y-34,Math.cos(a)*rand(220,420),Math.sin(a)*rand(220,420),rand(0.5,1),Math.random()<0.5?'#4a9eff':'#ffffff',rand(3,6),400);
      }
      markDirty();
    }
  }
  if(G.jufeiShell){
    const sh=G.jufeiShell;
    sh.x+=sh.vx*dt;sh.rot+=dt*18;sh.life-=dt;sh.vx*=Math.pow(0.55,dt);
    const tc1=sh.isStone?'#c8d0d8':'#a8c090',tc2=sh.isStone?'#8890a0':'#6fdb60';
    if(Math.random()<dt*90)addParticle(sh.x+rand(-24,24),sh.y+rand(-24,24),rand(-140,30),rand(-100,100),rand(0.3,0.7),Math.random()<0.5?tc1:tc2,rand(2,4.5),0);
    for(let i=obstacles.length-1;i>=0;i--){
      const o=obstacles[i];
      if(Math.abs(o.x+o.w/2-sh.x)<70&&Math.abs(o.y+o.h/2-sh.y)<90){
        for(let k=0;k<12;k++)addParticle(o.x+o.w/2,o.y+o.h/2,rand(-280,280),rand(-260,100),rand(0.3,0.75),Math.random()<0.5?tc1:tc2,rand(2,5),500);
        obstacles.splice(i,1);
      }
    }
    if(sh.life<=0||sh.x>W+100)G.jufeiShell=null;
  }
  if(G.dashT>0){
    G.dashT-=dt;G.invulnT=Math.max(G.invulnT,0.12);
    const _t=1-Math.max(0,G.dashT/DASH_DURATION);
    P.dashOffset=Math.sin(_t*Math.PI*0.5)*DASH_DIST;
    P.vy=0;P.y+=(GROUND_Y-P.y)*Math.min(1,dt*14);
    P.onGround=true;P.sliding=false;P.jumps=0;P.runPhase+=dt*22;
    if(Math.random()<dt*110)addParticle(P.x+P.dashOffset+rand(-14,14),P.y-rand(6,62),rand(-300,-100),rand(-40,40),rand(0.2,0.55),Math.random()<0.5?'#ffe066':'#ff8040',rand(2,4.8),0);
    if(G.dashT<=0){
      G.dashT=0;P.dashing=false;G.dashSpeedT=DASH_SPEED_TIME;
      G.invulnT=Math.max(G.invulnT,DASH_INVULN_TIME);G.shake=9;
      G.milestoneMsg='✨ 加速 10 秒 + 无敌 4 秒';G.milestoneMsgT=1.6;
      beep(660,0.12,'triangle',0.06,1000);
      setTimeout(()=>beep(990,0.16,'triangle',0.06,1400),90);
      for(let i=0;i<24;i++)addParticle(P.x+P.dashOffset+rand(-24,24),P.y-rand(4,70),rand(-260,260),rand(-320,80),rand(0.35,0.8),Math.random()<0.5?'#ffd93d':'#ffb060',rand(2.5,5.5),400);
    }
  }else if(P.flying){
    G.flightT-=dt;P.flyPhase+=dt;
    P.runPhase+=dt*4;
    const ty=GROUND_Y-FLY_HEIGHT;
    P.y+=(ty-P.y)*Math.min(1,dt*5.5);
    P.vy=0;P.onGround=false;
    const isEgg=ch.skinId==='kcb_egg';
    if(Math.random()<dt*80)addParticle(P.x+rand(-20,20),P.y+16+rand(-10,26),rand(-80,80),rand(100,220),rand(0.25,0.6),isEgg?(Math.random()<0.5?'#ffd966':'#fff5d0'):(Math.random()<0.5?'#00d9ff':'#a0f0ff'),rand(2,4.5),220);
    if(Math.random()<dt*24)addParticle(P.x-20+rand(-8,8),P.y-30+rand(-16,16),rand(-260,-120),rand(-30,30),rand(0.3,0.6),isEgg?(Math.random()<0.5?'#ffd966':'#fff5d0'):(Math.random()<0.5?'#00d9ff':'#7ee0ff'),rand(1.5,3.5),0);
    if(G.flightT<=0){P.flying=false;G.flightActive=false;G.flightT=0;G.flightCD=FLY_COOLDOWN;P.vy=120;G.shake=6;}
  }else{
    P.vy+=GRAVITY*dt;
    if(keys.down&&!P.onGround)P.vy+=GRAVITY*1.5*dt;
    P.y+=P.vy*dt;
    if(P.y>=GROUND_Y){
      if(!P.onGround){
        P.squash=0.74;
        beep(150,0.09,'sine',0.035,90);
        for(let i=0;i<12;i++)addParticle(P.x+rand(-20,20),GROUND_Y,rand(-190,190),rand(-130,-20),rand(0.25,0.55),'rgba(160,215,255,0.7)',rand(2,5),620);
        if(ch.skinId==='zzy_flame'){
          for(let i=0;i<20;i++){
            const dir=Math.random()<0.5?0:Math.PI;
            const a=dir+rand(-0.5,0.5);
            addParticle(P.x+rand(-10,10),GROUND_Y-rand(0,6),Math.cos(a)*rand(200,450),rand(-150,-30),rand(0.4,0.8),
              Math.random()<0.5?'#ff2020':'#ff8020',rand(2.5,5),400);
          }
          for(let i=0;i<16;i++){
            const a=rand(-Math.PI,0);
            addParticle(P.x,GROUND_Y,Math.cos(a)*rand(100,300),Math.sin(a)*rand(80,250),rand(0.4,0.8),
              Math.random()<0.5?'#d94fd9':'#ffd700',rand(2,4.5),200,'petal');
          }
          addParticle(P.x,GROUND_Y-2,0,0,0.6,'rgba(255,80,40,0.8)',rand(16,24),0);
        }
      }
      P.y=GROUND_Y;P.vy=0;P.onGround=true;P.jumps=0;P.coyote=0.12;
      if(P.jumpBuffer>0){P.jumpBuffer=0;jumpAction();}
    }else{P.onGround=false;P.coyote-=dt;}
  }
  if(P.jumpBuffer>0)P.jumpBuffer-=dt;
  const meters=G.distance/10;
  if(meters>=G.nextMilestone){
    G.nextMilestone+=800;G.rushT=2.6;G.stats.rushCount++;
    G.milestoneMsg='⚡ '+Math.floor(meters/800)*800+' 米  加速冲刺！';G.milestoneMsgT=2;
    beep(500,0.1,'square',0.05,900);
    setTimeout(()=>beep(760,0.14,'square',0.05,1200),100);
    for(let i=0;i<22;i++)addParticle(W-rand(0,120),GROUND_Y-rand(0,240),rand(-420,-160),rand(-120,120),rand(0.3,0.7),Math.random()<0.5?'#7ee0ff':'#ffd93d',rand(2,5),0);
  }
  if(G.rushT>0)G.rushT-=dt;
  if(G.milestoneMsgT>0)G.milestoneMsgT-=dt;
  let spd=Math.min(G.maxSpeed,G.baseSpeed+G.time*5);
if(G.rushT>0)spd*=1.22;
if(G.dashSpeedT>0)spd*=DASH_SPEED_MUL;
if(G.soulActive)spd*=1.2;
spd*=(map.speedMul||1)*(getWeather().speedMul||1);

// ===== 联机竞速动态补偿 =====
if (mpActive && mpPeers && Object.keys(mpPeers).length > 0) {
  const peer = mpPeers[Object.keys(mpPeers)[0]];
  if (peer && peer.distance) {
    const diff = peer.distance - G.distance;
    if (diff > 200) {
      spd *= 1.20; // 落后 20 米以上，速度 +20%
    } else if (diff > 50) {
      spd *= 1.10; // 落后 5 米以上，速度 +10%
    } else if (diff < -400) {
      spd *= 0.95; // 领先 40 米以上，速度 -5%（防止过于无脑）
    }
  }
}

G.speed=spd;
  const dx=G.speed*dt;
  G.distance+=dx;G.scroll+=dx;
  G.bg1+=dx*0.05;G.bg2+=dx*0.18;G.bg3+=dx*0.42;
  const cw=(map.comboWindow||1.8)*(getWeather().comboMul||1);
  if(ch.id!=='wsy'){
    if(G.comboTimer>0){G.comboTimer-=dt;if(G.comboTimer<=0)G.combo=0;}
  }else{
    if(G.comboTimer>0){G.comboTimer-=dt;if(G.comboTimer<=0)G.combo=0;}
  }
  if(G.magnetT>0)G.magnetT-=dt;
  if(G.doubleT>0)G.doubleT-=dt;
  if(G.invulnT>0)G.invulnT-=dt;
  if(G.invulnT>0&&Math.random()<dt*40)addParticle(P.x+rand(-24,24),P.y-rand(8,60),rand(-60,60),rand(-120,-20),rand(0.2,0.5),'rgba(126,224,255,0.95)',rand(2,4.5),0);
  if(map.ambient&&Math.random()<dt*22*PERF.envRate)spawnAmbientParticle(map);
  if(!P.flying&&keys.down&&P.onGround&&!P.slideLocked&&P.slideCD<=0&&G.dashT<=0){
    P.sliding=true;
    P.slideT=(0.3+ch.slideBonus)*(map.slideMul||1)*(1+(getWeather().slideBonus||0));
    P.slideMaxT=P.slideT;P.slideLocked=true;
    P.slideCD=SLIDE_CD*(getPet().passive.slideCDMul||1);

    const isEgg=ch.skinId==='kcb_egg';
    for(let i=0;i<12;i++)addParticle(P.x-14,GROUND_Y,rand(-260,-70),rand(-140,-20),rand(0.3,0.7),isEgg?(Math.random()<0.5?'rgba(255,245,208,0.9)':'rgba(255,217,102,0.85)'):'rgba(130,205,255,0.85)',rand(2,5.5),480);
  }
  if(!keys.down)P.slideLocked=false;
  if(P.sliding){
    P.slideT-=dt;
    if(P.slideT<=0)P.sliding=false;
    if(Math.random()<dt*45)addParticle(P.x-26+rand(-10,10),GROUND_Y-rand(1,5),rand(-320,-120),rand(-110,-20),rand(0.2,0.5),Math.random()<0.5?'rgba(180,230,255,0.9)':'rgba(255,220,120,0.8)',rand(1.5,4),620);
  }
  if(P.onGround&&!P.sliding&&!P.flying){
    P.runPhase+=dt*(G.speed/34);
    if(Math.random()<dt*26)addParticle(P.x-16,GROUND_Y-2,rand(-160,-40),rand(-90,-10),rand(0.2,0.45),'rgba(140,200,255,0.5)',rand(1.5,3.5),380);
  }

  characterParticles(ch,dt);

    const o=obstacles[i];

    else if(o.type==='hologram'){o.bobT+=dt*2.6;o.y=o.baseY+Math.sin(o.bobT)*o.bobA;}
    else if(o.type==='fireball'){o.phase+=dt*4;o.y=o.baseY-o.h/2-Math.sin(o.phase)*o.amp;}
    else if(o.type==='petalwind'){o.phase+=dt*3;}

const _coinCache=(function(){
  const R=14,PAD=20,S=R+PAD;

  c.width=S*2*DPR;c.height=S*2*DPR;

})();

function drawItemFx(){
  for(const f of G.itemFx){
    const k=1-f.t/f.max;
    const col=f.type==='shield'?'#7ee0ff':(f.type==='magnet'?'#ff5c7a':'#ffd93d');
    ctx.save();ctx.globalAlpha=(1-k)*0.95;
    ctx.strokeStyle=col;ctx.lineWidth=3.5;
    ctx.beginPath();ctx.arc(f.x,f.y,16+k*90,0,Math.PI*2);ctx.stroke();ctx.restore();
  }
  
  // 牢大肘击特效
  if(G.elbowFx){
    const k = 1 - (G.elbowFx.t / G.elbowFx.max);
    ctx.save();
    ctx.translate(G.elbowFx.x, G.elbowFx.y);
    ctx.globalAlpha = 1 - k;
    ctx.scale(1 + k * 0.8, 1 + k * 0.8);
    
    // 巨大的“肘”字
    ctx.fillStyle = '#f1c40f';
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 20;
    ctx.font = 'bold 44px ' + FONT;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('肘!', 0, 0);
    
    // 飞溅的黄紫碎片
    for(let i=0; i<10; i++){
      const a = (i/10) * Math.PI * 2 + k * 3;
      const r = 20 + k * 70;
      ctx.fillStyle = i%2===0 ? '#8e44ad' : '#f1c40f';
      ctx.beginPath(); ctx.arc(Math.cos(a)*r, Math.sin(a)*r, 5*(1-k), 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}
function drawParticles(){
  for(let i=0;i<particles.length;i++){
    const p=particles[i];
    const a=p.life/p.maxLife;
    const alpha=a*a;

    ctx.globalAlpha=alpha;
    if(p.shape==='petal'){
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate((1-a)*3.2);

  }
  ctx.globalAlpha=1;
}

function drawLightningBolt(cx,cy,alpha,scale,big,customTop,customBot){
  scale=scale||1;big=big||false;

  const top=(customTop!==undefined)?customTop:(cy-(big?90:60));

  const segs=big?16:10;

  const path=function(){
    ctx.beginPath();ctx.moveTo(cx,top);

function drawShellPattern(cx,cy,rx,ry){
  ctx.save();
  ctx.strokeStyle='rgba(60,90,50,0.5)';
  ctx.lineWidth=1.6;
  ctx.lineJoin='round';
  const hexR=rx*0.30;
  const pts=[];
  for(let i=0;i<6;i++){
    const a=i*Math.PI/3-Math.PI/2;
    pts.push([cx+Math.cos(a)*hexR, cy+Math.sin(a)*hexR*(ry/rx)]);
  }
  ctx.beginPath();
  for(let i=0;i<6;i++){
    if(i===0)ctx.moveTo(pts[i][0],pts[i][1]);
    else ctx.lineTo(pts[i][0],pts[i][1]);
  }
  ctx.closePath();ctx.stroke();
  for(let i=0;i<6;i++){
    const a=i*Math.PI/3-Math.PI/2;
    ctx.beginPath();
    ctx.moveTo(pts[i][0],pts[i][1]);
    ctx.lineTo(cx+Math.cos(a)*(rx*0.88), cy+Math.sin(a)*(ry*0.88));
    ctx.stroke();
  }
  ctx.restore();
}

// 牢大专属滑铲：化身篮球
function drawKobeBasketball(ch, t) {
  ctx.save();
  // 压低位置，贴地滑铲
  ctx.translate(12, -14);
  
  // 1. 画出后方滚动的残影（速度线）
  ctx.save();
  ctx.translate(-18, 0);
  ctx.strokeStyle = 'rgba(255, 153, 48, 0.4)';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  for(let i=0; i<3; i++){
     ctx.beginPath();
     ctx.arc(-i*8, 0, 14, Math.PI * 0.6, Math.PI * 1.4);
     ctx.stroke();
  }
  ctx.restore();

  // 2. 核心滚动旋转：使用 G.time 保证永远在转，速度越快转越快
  const rollSpeed = (G.speed || 200) * 0.06; 
  ctx.rotate(G.time * rollSpeed); 

  const r = 18;
  // 3. 篮球橙色渐变主体
  const bg = ctx.createRadialGradient(-r*0.4, -r*0.4, r*0.1, 0, 0, r);
  bg.addColorStop(0, '#ffb347');
  bg.addColorStop(1, '#cc5500');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();

  // 4. 篮球黑色纹路（用不对称的线条突出滚动感）
  ctx.strokeStyle = '#1a1a1a'; 
  ctx.lineWidth = 2.5;
  
  // 横向和纵向线
  ctx.beginPath(); ctx.moveTo(-r, 0); ctx.lineTo(r, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(0, r); ctx.stroke();
  
  // 两侧的弧形纹路
  ctx.beginPath(); ctx.arc(-r*1.1, 0, r*1.2, -Math.PI*0.4, Math.PI*0.4); ctx.stroke();
  ctx.beginPath(); ctx.arc(r*1.1, 0, r*1.2, Math.PI*0.6, Math.PI*1.4); ctx.stroke();

  // 5. 增加一个明显的高光点，随着球一起转，视觉上就有真实滚动感了
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.beginPath(); ctx.arc(-r*0.4, -r*0.4, 5, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}

  ctx.closePath();
  ctx.fill();
  
  // 3. 金色反光包边（让它看起来有丝绸质感）
  ctx.strokeStyle = 'rgba(255, 215, 0, 0.85)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-50, -20 + windLift + f1);
  ctx.lineTo(-45, -15 + windLift + f3);
  ctx.quadraticCurveTo(-38, -22 + windLift + f2, -30, -12 + windLift + f1);
  ctx.stroke();

  // 4. 披风褶皱细节（几条暗线，增强布料感）
  ctx.strokeStyle = 'rgba(0, 0, 0, 0.2)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-15, -40);
  ctx.quadraticCurveTo(-30, -35, -40, -20 + windLift);
  ctx.stroke();
  
  ctx.restore();
  // ================= 披风结束 =================

  // ================= 1. 画后侧腿（深色） =================
  ctx.strokeStyle = '#997a1a'; 
  ctx.lineWidth = 10;
  ctx.beginPath();
  ctx.moveTo(-2, -20);
  if (isJump) {
    ctx.lineTo(-12, -5); ctx.lineTo(-2, 8); 
  } else {
    ctx.lineTo(-2 + legSwing * 10, -8); 
    ctx.lineTo(-2 + legSwing * 18, 0);
  }
  ctx.stroke();

  // ================= 2. 画后侧手臂（深紫色） =================
  ctx.strokeStyle = '#6a2c8a'; 
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.moveTo(-4, -40);
  ctx.lineTo(-12, -25); 
  ctx.stroke();
  ctx.fillStyle = SKIN;
  ctx.beginPath(); ctx.arc(-12, -25, 4, 0, Math.PI*2); ctx.fill();

  // ================= 3. 画躯干与球衣 =================
  ctx.fillStyle = SHIRT_Y;
  roundRect(-10, -50, 20, 28, 8); ctx.fill();
  ctx.fillStyle = SHIRT_P;
  roundRect(-10, -35, 20, 13, 4); ctx.fill();
  
  // 号码 24
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 12px ' + FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('24', 0, -34);

  // 披风的黄金搭扣
  ctx.fillStyle = '#ffd700';
  ctx.beginPath(); ctx.arc(-6, -46, 2.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(6, -46, 2.5, 0, Math.PI*2); ctx.fill();

  // ================= 4. 画前侧腿（亮色） =================
  ctx.strokeStyle = '#f1c40f'; 
  ctx.lineWidth = 10;
  ctx.beginPath();
  ctx.moveTo(2, -20);
  if (isJump) {
    ctx.lineTo(12, -10); ctx.lineTo(5, 2); 
  } else {
    ctx.lineTo(2 - legSwing * 10, -8); 
    ctx.lineTo(2 - legSwing * 18, 0);
  }
  ctx.stroke();
  
  ctx.fillStyle = '#ffffff';
  const fx = isJump ? 5 : 2 - legSwing * 18;
  const fy = isJump ? 2 : 0;
  ctx.beginPath(); ctx.ellipse(fx + 2, fy, 7, 4, 0, 0, Math.PI*2); ctx.fill();

  // ================= 5. 画头部（圆润光头） =================
  ctx.fillStyle = SKIN;
  ctx.fillRect(-3, -54, 6, 6);
  ctx.beginPath(); ctx.arc(0, -60, 11, 0, Math.PI*2); ctx.fill();
  
  // 侧脸鼻子凸起
  ctx.beginPath(); ctx.moveTo(8, -62); ctx.lineTo(13, -58); ctx.lineTo(8, -55); ctx.fill();
  
  // 光头高光
  ctx.fillStyle = 'rgba(255,255,255,0.3)'; 
  ctx.beginPath(); ctx.ellipse(-3, -65, 4, 3, -0.5, 0, Math.PI*2); ctx.fill();
  
  // 耳朵与眼神
  ctx.fillStyle = '#b07b48';
  ctx.beginPath(); ctx.arc(-4, -58, 3, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#1a1a2e';
  ctx.beginPath(); ctx.arc(6, -59, 1.8, 0, Math.PI*2); ctx.fill();

  // ================= 6. 画运球手与篮球 =================
  if (isJump) {
    ctx.strokeStyle = SHIRT_Y; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(5, -40); ctx.quadraticCurveTo(15, -40, 10, -30); ctx.stroke();
    ctx.save(); ctx.translate(0, -30);
    drawSimpleBall(ballR, t, 1);
    ctx.restore();
  } else {
    ctx.strokeStyle = SHIRT_Y; 
    ctx.lineWidth = 8;
    ctx.beginPath(); 
    ctx.moveTo(5, -40); 
    ctx.quadraticCurveTo(18, -30 + bounce * 10, ballX, ballY - 8);
    ctx.stroke();
    
    ctx.fillStyle = SKIN;
    ctx.beginPath(); ctx.arc(ballX - 2, ballY - 8, 4, 0, Math.PI*2); ctx.fill();

    ctx.save();
    ctx.translate(ballX, ballY);
    let squash = 1;
    if (bounce < 0.1) squash = 0.8;
    ctx.scale(1 / Math.sqrt(squash), squash);
    ctx.rotate(t * 3);
    drawSimpleBall(ballR, t, 0);
    ctx.restore();
    
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(ballX, 2, 6 * (1 - bounce*0.5), 2, 0, 0, Math.PI*2); ctx.fill();
  }

  ctx.restore();
}

// 辅助画小篮球的函数
function drawSimpleBall(r, t, isHeld) {
  const bg = ctx.createRadialGradient(-r*0.3, -r*0.3, 2, 0, 0, r);
  bg.addColorStop(0, '#ffb347'); bg.addColorStop(1, '#cc5500');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
  
  ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(-r, 0); ctx.lineTo(r, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(0, r); ctx.stroke();
  ctx.beginPath(); ctx.arc(-r*0.9, 0, r*1.1, -Math.PI*0.35, Math.PI*0.35); ctx.stroke();
  ctx.beginPath(); ctx.arc(r*0.9, 0, r*1.1, Math.PI*0.65, Math.PI*1.35); ctx.stroke();
}

function drawKobeSkydiving(ch, t) {
  const SKIN = '#c68c53';
  const SHIRT_Y = '#f1c40f';
  const SHIRT_P = '#8e44ad';
  
  ctx.save();
  // 身体整体微微前倾，呈俯冲滑翔姿态
  ctx.rotate(0.15); 
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // 时间变量，用于披风和身体飘动的动画
  const wind = Math.sin(t * 6) * 6; 

  // ================= 0. 背后飘舞的紫金披风 =================
  ctx.save();
  const capeGrad = ctx.createLinearGradient(-10, -50, -40, -80);
  capeGrad.addColorStop(0, '#8e44ad'); // 紫色
  capeGrad.addColorStop(0.6, '#5c1f73'); // 深紫
  capeGrad.addColorStop(1, '#f1c40f'); // 金色末端
  
  ctx.fillStyle = capeGrad;
  ctx.beginPath();
  // 从肩膀后侧起笔
  ctx.moveTo(-5, -50); 
  // 向上方/后方飘起
  ctx.bezierCurveTo(-20, -70, -45, -60 + wind, -55, -85 + wind); 
  // 披风下摆的波浪
  ctx.lineTo(-45, -75 + wind);
  ctx.quadraticCurveTo(-35, -60 - wind, -40, -50 + wind);
  ctx.lineTo(-25, -35 + wind);
  // 回到腰部
  ctx.quadraticCurveTo(-15, -40, -10, -20); 
  ctx.closePath();
  ctx.fill();

  // 披风的金色内衬/反光边缘
  ctx.strokeStyle = 'rgba(255, 215, 0, 0.6)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-45, -75 + wind);
  ctx.quadraticCurveTo(-35, -60 - wind, -40, -50 + wind);
  ctx.stroke();
  ctx.restore();

  // ================= 1. 后侧手臂（向后上方扬起） =================
  ctx.strokeStyle = '#6a2c8a'; // 深紫
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.moveTo(-6, -40);
  ctx.quadraticCurveTo(-20, -50, -25, -60);
  ctx.stroke();
  ctx.fillStyle = SKIN;
  ctx.beginPath(); ctx.arc(-25, -60, 4, 0, Math.PI*2); ctx.fill(); // 后手

  // ================= 2. 后侧腿（向后弯曲） =================
  ctx.strokeStyle = '#997a1a'; // 深黄
  ctx.lineWidth = 10;
  ctx.beginPath();
  ctx.moveTo(-2, -20);
  ctx.lineTo(-15, -5);
  ctx.lineTo(-10, 15); // 后脚跟抬起
  ctx.stroke();

  // ================= 3. 身体与球衣 =================
  const bg = ctx.createLinearGradient(0, -50, 0, -20);
  bg.addColorStop(0, SHIRT_Y); bg.addColorStop(1, SHIRT_P);
  ctx.fillStyle = bg;
  roundRect(-12, -48, 22, 28, 8); ctx.fill();
  
  // 飘起的球衣下摆
  ctx.beginPath(); 
  ctx.moveTo(-10, -20); ctx.lineTo(-18, -12); ctx.lineTo(-5, -22); ctx.fill();
  
  // 24号
  ctx.fillStyle = '#fff'; ctx.font = 'bold 12px ' + FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('24', -1, -34);

  // 领口处披风的黄金搭扣
  ctx.fillStyle = '#ffd700';
  ctx.beginPath(); ctx.arc(-4, -48, 2.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(4, -48, 2.5, 0, Math.PI*2); ctx.fill();

  // ================= 4. 前侧腿（向前伸直准备触地） =================
  ctx.strokeStyle = '#f1c40f'; // 亮黄
  ctx.lineWidth = 10;
  ctx.beginPath();
  ctx.moveTo(2, -20);
  ctx.lineTo(15, -10);
  ctx.lineTo(12, 10); // 前脚跟向下
  ctx.stroke();

  // 前脚鞋子
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(14, 12, 8, 4, -0.2, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#8e44ad';
  ctx.fillRect(10, 14, 12, 2);

  // ================= 5. 头部 =================
  ctx.fillStyle = SKIN;
  ctx.fillRect(-3, -54, 6, 8);
  ctx.beginPath(); ctx.arc(0, -60, 11, 0, Math.PI*2); ctx.fill();
  
  // 侧脸和光头高光
  ctx.beginPath(); ctx.moveTo(8, -62); ctx.lineTo(13, -58); ctx.lineTo(8, -55); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.3)'; 
  ctx.beginPath(); ctx.ellipse(-3, -65, 4, 3, -0.5, 0, Math.PI*2); ctx.fill();

  // ================= 6. 前侧手臂（霸气前伸，单手压地） =================
  ctx.strokeStyle = SHIRT_Y;
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.moveTo(5, -40);
  // 向前下方伸出
  ctx.quadraticCurveTo(20, -30, 28, -15);
  ctx.stroke();
  
  // 前手（张开准备接触地面）
  ctx.fillStyle = SKIN;
  ctx.beginPath(); ctx.arc(28, -15, 4.5, 0, Math.PI*2); ctx.fill();

  // ================= 7. 速度线特效 =================
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-20, -55); ctx.lineTo(-35, -65); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-25, -40); ctx.lineTo(-45, -45); ctx.stroke();

  ctx.restore();
}

// 3. 飞行：变身直升机
function drawKobeHelicopter(ch, t) {
  ctx.save(); ctx.translate(0, -50);
  
  // 机身（黄紫配色）
  const bodyG = ctx.createLinearGradient(-30, 0, 30, 0);
  bodyG.addColorStop(0, '#f1c40f'); bodyG.addColorStop(1, '#8e44ad');
  ctx.fillStyle = bodyG; ctx.beginPath(); ctx.ellipse(0, 0, 40, 25, 0, 0, Math.PI*2); ctx.fill();
  
  // 机尾
  ctx.fillStyle = '#8e44ad'; ctx.beginPath(); ctx.moveTo(-25, -5); ctx.lineTo(-65, -10); ctx.lineTo(-65, 5); ctx.lineTo(-25, 10); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#f1c40f'; ctx.fillRect(-65, -6, 10, 12);

  // 尾翼旋转
  ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-65, 0); ctx.lineTo(-65, Math.sin(t * 40) * 20); ctx.stroke();

  // 驾驶舱（透明玻璃）
  ctx.fillStyle = 'rgba(100,200,255,0.3)'; ctx.beginPath(); ctx.arc(15, -2, 16, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();

  ctx.fillStyle = ch.skin; ctx.beginPath(); ctx.arc(15, -2, 9, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#1a1a2e'; ctx.beginPath(); ctx.arc(18, -2, 2, 0, Math.PI*2); ctx.fill(); 
  ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.beginPath(); ctx.arc(12, -6, 3, 0, Math.PI*2); ctx.fill();

  // 起落架
  ctx.strokeStyle = '#555'; ctx.lineWidth = 4; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-15, 20); ctx.lineTo(-25, 35); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(15, 20); ctx.lineTo(25, 35); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-30, 35); ctx.lineTo(-20, 35); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(20, 35); ctx.lineTo(30, 35); ctx.stroke();

  // 主螺旋桨虚影
  const bladeLen = 60 + Math.sin(t*60)*5;
  ctx.save(); ctx.translate(0, -30);
  ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.beginPath(); ctx.ellipse(0, 0, bladeLen, 15, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(-bladeLen, 0); ctx.lineTo(bladeLen, 0); ctx.stroke();
  ctx.fillStyle = '#333'; ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI*2); ctx.fill();
  ctx.restore(); ctx.restore();
}
function drawCharacterBody(ch,t,sliding,flyingOverride){
  const isFlying=flyingOverride!==undefined?flyingOverride:P.flying;

// 拦截牢大专属动作
if(ch.skinId==='kcb_laoda'){
  if(isFlying){ drawKobeHelicopter(ch, t); return; }
  if(P.vy > 100 && !P.onGround){ drawKobeSkydiving(ch, t); return; }
  if(sliding){ drawKobeBasketball(ch, t); return; }
  drawKobeReal(ch, t); return;
}

// 以下是原有的其他角色逻辑...
  if(ch.skinId==='ylz_turtle'){if(sliding)drawTurtleSlide(ch);else drawTurtlePose(ch,t);return;}
  if(ch.skinId==='kcb_egg'){if(isFlying)drawEggFlyingPose(ch,t);else if(sliding)drawVanishingPose();else drawEggRiderPose(ch,t);return;}
  if(ch.skinId==='zzy_flame'){if(sliding)drawFlameLotusSlide(ch);else drawFlameLotusPose(ch,t,isFlying);return;}
  if(sliding){drawSlidePose(ch);return;}
  if(isFlying&&ch.id==='kcb'){drawFlyingPose(ch,t);return;}
  const SKIN=ch.skin,SHIRT=ch.shirt,SHIRT2=ch.shirt2,PANTS=ch.pants,HAIR=ch.hair,SHOE=ch.shoe;
  const build=ch.build||1;
  ctx.save();
  if(build!==1){ctx.translate(0,-66);ctx.scale(build,1);ctx.translate(0,66);}
  ctx.lineCap='round';
  const swA=Math.sin(t),swB=Math.sin(t+Math.PI);
  ctx.strokeStyle='#2c4270';ctx.lineWidth=9;
  ctx.beginPath();ctx.moveTo(-1,-24);ctx.lineTo(-1+Math.sin(swB)*24,-24+Math.cos(swB)*24);ctx.stroke();
  ctx.strokeStyle=SHIRT2;ctx.lineWidth=8;
  ctx.beginPath();ctx.moveTo(-2,-44);ctx.lineTo(-2+Math.sin(swA)*22,-44+Math.cos(swA)*22);ctx.stroke();
  const bg=ctx.createLinearGradient(0,-50,0,-20);
  bg.addColorStop(0,SHIRT);bg.addColorStop(1,SHIRT2);
  ctx.fillStyle=bg;roundRect(-14,-50,28,29,10);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.22)';roundRect(-11,-47,9,20,5);ctx.fill();
  ctx.strokeStyle=PANTS;ctx.lineWidth=10;
  ctx.beginPath();ctx.moveTo(1,-24);ctx.lineTo(1+Math.sin(swA)*25,-24+Math.cos(swA)*25);ctx.stroke();
  const fx=1+Math.sin(swA)*25,fy=-24+Math.cos(swA)*25;
  ctx.fillStyle=SHOE;
  ctx.save();ctx.translate(fx,fy);ctx.rotate(swA*0.35);roundRect(-6,-4,15,8,4);ctx.fill();ctx.restore();
  const bx=-1+Math.sin(swB)*24,by=-24+Math.cos(swB)*24;
  ctx.fillStyle='rgba(200,212,232,0.9)';
  ctx.save();ctx.translate(bx,by);ctx.rotate(swB*0.35);roundRect(-6,-4,14,8,4);ctx.fill();ctx.restore();
  ctx.strokeStyle=SHIRT;ctx.lineWidth=9;
  ctx.beginPath();ctx.moveTo(2,-44);ctx.lineTo(2+Math.sin(swB)*23,-44+Math.cos(swB)*23);ctx.stroke();
  ctx.fillStyle=SKIN;
  ctx.beginPath();ctx.arc(2+Math.sin(swB)*23,-44+Math.cos(swB)*23,4.6,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=SKIN;ctx.fillRect(-4,-56,8,8);
  ctx.beginPath();ctx.arc(0,-60,12,0,Math.PI*2);ctx.fillStyle=SKIN;ctx.fill();
  ctx.beginPath();ctx.arc(0,-61,12.4,Math.PI*1.02,Math.PI*2.02);ctx.fillStyle=HAIR;ctx.fill();
  drawHairStyle(ch.hairStyle,HAIR,0,-60,1);
  ctx.beginPath();ctx.arc(-10,-59,3,0,Math.PI*2);ctx.fillStyle=SKIN;ctx.fill();
  if(ch.hairStyle!=='aviator'&&ch.hairStyle!=='chicken'){
    const bl=(Math.sin(G.time*1.7+ch.price)>0.985)?0.12:1;
    ctx.fillStyle='#1a1a2e';
    ctx.beginPath();ctx.ellipse(5.4,-60,2,2.4*bl,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(-2.2,-60,2,2.4*bl,0,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

// 角色 / 皮肤短码映射（懒初始化）
let _charCodeMap = null;
let _charIdMap = null;
function ensureCharMaps(){
  if (_charCodeMap) return;
  _charCodeMap = {};
  _charIdMap = {};
  CHARS.forEach((c, i) => {
    const code = i.toString(36);
    _charCodeMap[c.id] = code;
    _charIdMap[code] = c.id;
  });
}

function genFriendCode(){
  ensureCharMaps();
  const rawName = (G.nickname || localStorage.getItem('wjw_username') || '跑者').toString();
  const name = rawName.replace(/[-|]/g, '').slice(0, 8) || '跑者';
  const best36 = Math.max(0, Math.floor(G.best || 0)).toString(36);
  const charIdx = Math.max(0, CHARS.findIndex(c => c.id === G.selected));
  const charCode = charIdx.toString(36);
  const base = CHARS[charIdx] || CHARS[0];
  const skins = base.skins || [];
  const sid = G.charSkins[G.selected] || (G.selected + '_default');
  const skinIdx = Math.max(0, skins.findIndex(s => s.id === sid));
  return name + '-' + best36 + '-' + charCode + '-' + skinIdx.toString(36);
}

function parseFriendCode(code){
  if (!code) return null;
  const raw = String(code).trim();

  // 先尝试短码格式：名字-分数36-角色码-皮肤码
  const parts = raw.split('-');
  if (parts.length >= 3 && parts.length <= 4) {
    const name = (parts[0] || '跑者').slice(0, 8) || '跑者';
    const best = parseInt(parts[1], 36);
    if (!isNaN(best) && best >= 0) {
      ensureCharMaps();
      const charCode = parts[2] || '0';
      const charId = _charIdMap[charCode] || 'mdf';
      const skinIdx = parseInt(parts[3] || '0', 36) || 0;
      const base = CHARS.find(c => c.id === charId) || CHARS[0];
      const skinId = (base.skins && base.skins[skinIdx])
        ? base.skins[skinIdx].id
        : (charId + '_default');
      return {
        name: name,
        best: Math.max(0, Math.floor(best)),
        charId: charId,
        skinId: skinId,
        ts: Date.now()
      };
    }
  }

  // 兼容旧的 base64 长码
  try {
    const json = decodeURIComponent(escape(atob(raw)));
    const d = JSON.parse(json);
    if (!d.n || typeof d.b !== 'number') return null;
    return {
      name: String(d.n).slice(0, 12),
      best: Math.max(0, Math.floor(d.b)),
      charId: d.c || 'mdf',
      skinId: d.s || '',
      ts: d.t || Date.now()
    };
  } catch (e) {
    return null;
  }
}

function addFriendByCode(){
  const input=prompt('粘贴好友码：','');
  if(!input)return;
  const f=parseFriendCode(input);
  if(!f){alert('好友码无效，请检查是否完整复制');return;}
  if(G.friends.some(x=>x.ts===f.ts&&x.name===f.name)){
    alert('这个好友已经添加过了');
    return;
  }
  G.friends.unshift({name:f.name,best:f.best,charId:f.charId,skinId:f.skinId,ts:f.ts});
  if(G.friends.length>20)G.friends.length=20;
  markDirty();saveProgress();
  alert('已添加好友：'+f.name+'（最高 '+f.best+' 米）');
}

function buildFriendRanking(){
  const myName = G.nickname || localStorage.getItem('wjw_username') || getChar().name || '我';
  const rows = [];
  G.friends.forEach((f, idx) => {
    rows.push({
      name: f.name || '跑者',
      best: f.best || 0,
      charId: f.charId || 'mdf',
      skinId: f.skinId || '',
      idx: idx,
      isMe: false
    });
  });
  rows.push({
    name: myName,
    best: G.best || 0,
    charId: G.selected,
    skinId: G.charSkins[G.selected] || '',
    idx: -1,
    isMe: true
  });
  rows.sort((a, b) => b.best - a.best);
  return rows;
}

    else if(o.type==='hologram'){o.bobT+=dt*2.6;o.y=o.baseY+Math.sin(o.bobT)*o.bobA;}

  }
  const pcx=P.x+P.dashOffset,pcy=P.y-(P.sliding?14:32);
  const gr=24*ch.coinRange*(1+(getPet().passive.coinRange||0));
  for(let i=coins.length-1;i>=0;i--){

  for(let i=obstacles.length-1;i>=0;i--){
    const o=obstacles[i];o.x-=dx;
    if(o.type==='drone'){o.bobT+=dt*3;o.y=o.baseY-o.w/2+Math.sin(o.bobT)*o.bobA;}
    else if(o.type==='hologram'){o.bobT+=dt*2.6;o.y=o.baseY+Math.sin(o.bobT)*o.bobA;}
    else if(o.type==='fireball'){o.phase+=dt*4;o.y=o.baseY-o.h/2-Math.sin(o.phase)*o.amp;}
    else if(o.type==='petalwind'){o.phase+=dt*3;}
    if(o.x+o.w<-180){obstacles.splice(i,1);continue;}
    const obox=mapObstacleBox(o);
    if(aabb(pbox,obox)){
      if(G.invulnT>0){obstacles.splice(i,1);continue;}
      G.invulnT=0.8;G.coinRushSlowT=1.2;G.shake=14;
      obstacles.splice(i,1);
    }
  }
  const pcx=P.x+P.dashOffset,pcy=P.y-(P.sliding?14:32);
  const gr=32*(P.flying?1.7:1)+(G.magnetT>0?60:0);
  const mag=G.magnetT>0||P.flying;
  for(let i=coins.length-1;i>=0;i--){
    const c=coins[i];c.x-=dx;c.phase+=dt*4.5;
    if(mag){const ddx=pcx-c.x,ddy=pcy-c.y;const d=Math.sqrt(ddx*ddx+ddy*ddy)||1;
      if(d<360){const pull=620*dt*(1-d/380);c.x+=ddx/d*pull;c.y+=ddy/d*pull;}}
    if(c.x<-80){coins.splice(i,1);continue;}
    const ddx=c.x-pcx,ddy=c.y-pcy,rr=c.r+gr;
    if(ddx*ddx+ddy*ddy<rr*rr){
      coins.splice(i,1);
      G.combo++;G.comboTimer=cw;
      if(G.combo>G.comboMax)G.comboMax=G.combo;
      const mult=Math.min(5,1+Math.floor(G.combo/5));
      const gain=Math.max(1,Math.floor(mult*(G.doubleT>0?2:1)*2));
      G.coins+=gain;G.totalCoins+=gain;G.stats.totalEarned+=gain;
      beep(1150+Math.min(G.combo,24)*24,0.09,'sine',0.045,1900);
    }
  }
  updateParticles(dt);
}

function updateSpeedDemon(dt){
  G.time+=dt;updateWeatherFx(dt);
  if(G.shake>0.4){G.shake*=Math.pow(0.015,dt);if(G.shake<0.4)G.shake=0;}else G.shake=0;
  if(G.milestoneMsgT>0)G.milestoneMsgT-=dt;
  if(G.mode==='sddead'){
    G.deadT+=dt;P.vy+=GRAVITY*dt;P.y+=P.vy*dt;
    if(P.y>=GROUND_Y){P.y=GROUND_Y;P.vy=0;}
    P.rot=Math.min(P.rot+dt*7,Math.PI*0.5);
    const d=60*dt;G.scroll+=d;G.bg1+=d*0.05;G.bg2+=d*0.18;G.bg3+=d*0.42;
    updateParticles(dt);return;
  }
  if(G.mode!=='sd')return;
  G.sdPhaseCD-=dt;
  if(G.sdPhaseCD<=0){
    G.sdPhaseCD=SD.phaseInterval;G.sdPhase++;G.sdSpeedMul*=SD.phaseMul;
    G.shake=Math.max(G.shake,10);
    G.milestoneMsg='⚡ 第 '+(G.sdPhase+1)+' 阶 · 速度 ×'+G.sdSpeedMul.toFixed(2);
    G.milestoneMsgT=1.4;
    beep(600,0.15,'square',0.05,900);
  }
  if(G.sdBoostT>0)G.sdBoostT-=dt;
  const base=SD.baseSpeed+G.time*SD.speedGrowth;
  let spd=base*G.sdSpeedMul;
  if(G.sdBoostT>0)spd*=SD.boostMul;
  G.speed=Math.min(spd,1800);
  const ch=getChar(),map=getMap();
  if(G.slideCD>0)P.slideCD-=dt;
  if(G.invulnT>0)G.invulnT-=dt;
  if(P.sliding){P.slideT-=dt;if(P.slideT<=0)P.sliding=false;}
  P.vy+=GRAVITY*dt;
  if(keys.down&&!P.onGround)P.vy+=GRAVITY*1.5*dt;
  P.y+=P.vy*dt;
  if(P.y>=GROUND_Y){
    if(!P.onGround){P.squash=0.7;beep(160,0.08,'sine',0.035,90);}
    P.y=GROUND_Y;P.vy=0;P.onGround=true;P.jumps=0;P.coyote=0.12;
    if(P.jumpBuffer>0){P.jumpBuffer=0;jumpAction();}
  }else{P.onGround=false;P.coyote-=dt;}
  if(P.jumpBuffer>0)P.jumpBuffer-=dt;
  if(!P.flying&&keys.down&&P.onGround&&!P.slideLocked&&P.slideCD<=0){
    P.sliding=true;P.slideT=(0.28+ch.slideBonus)*(map.slideMul||1);P.slideMaxT=P.slideT;
    P.slideLocked=true;P.slideCD=SLIDE_CD*(getPet().passive.slideCDMul||1);
  }
  if(!keys.down)P.slideLocked=false;
  if(P.onGround&&!P.sliding)P.runPhase+=dt*(G.speed/34);
  P.squash+=(1-P.squash)*Math.min(1,dt*13);
  characterParticles(ch,dt);
  const dx=G.speed*dt;
  G.distance+=dx;G.scroll+=dx;
  G.bg1+=dx*0.05;G.bg2+=dx*0.18;G.bg3+=dx*0.42;
  if(map.ambient&&Math.random()<dt*20*PERF.envRate)spawnAmbientParticle(map);
  G.nextSpawn-=dx;
  if(G.nextSpawn<=0){
    spawnObstacle();
    const spdFactor=Math.max(0.55,1-(G.speed-200)/1200);
    G.nextSpawn=G.speed*(1.2+Math.random()*0.5)*(map.spawnMul||1)*spdFactor;
  }
  G.nextCoin-=dx;
  if(G.nextCoin<=0){spawnCoins();G.nextCoin=rand(320,640)/(map.coinRate||1);}
  const pbox=playerBox();
  for(let i=obstacles.length-1;i>=0;i--){
    const o=obstacles[i];o.x-=dx;
    if(o.type==='drone'){o.bobT+=dt*3;o.y=o.baseY-o.w/2+Math.sin(o.bobT)*o.bobA;}
    else if(o.type==='hologram'){o.bobT+=dt*2.6;o.y=o.baseY+Math.sin(o.bobT)*o.bobA;}
    else if(o.type==='fireball'){o.phase+=dt*4;o.y=o.baseY-o.h/2-Math.sin(o.phase)*o.amp;}
    else if(o.type==='petalwind'){o.phase+=dt*3;}
    if(o.x+o.w<-180){obstacles.splice(i,1);continue;}
    const obox=mapObstacleBox(o);
    if(aabb(pbox,obox)){
      if(G.invulnT>0){obstacles.splice(i,1);continue;}
      endSpeedDemon();return;
    }
  }
  const pcx=P.x+P.dashOffset,pcy=P.y-(P.sliding?14:32);
  const gr=24*ch.coinRange*(1+(getPet().passive.coinRange||0));
  const cw=(map.comboWindow||1.8)*(getWeather().comboMul||1);
  if(G.comboTimer>0){G.comboTimer-=dt;if(G.comboTimer<=0)G.combo=0;}
  for(let i=coins.length-1;i>=0;i--){
    const c=coins[i];c.x-=dx;c.phase+=dt*4.5;
    if(c.x<-80){coins.splice(i,1);continue;}
    const ddx=c.x-pcx,ddy=c.y-pcy,rr=c.r+gr;
    if(ddx*ddx+ddy*ddy<rr*rr){
      coins.splice(i,1);
      G.combo++;G.comboTimer=cw;
      if(G.combo>G.comboMax)G.comboMax=G.combo;
      G.sdBoostT=SD.boostDuration;
      const mult=comboMult();
      const speedMul=1+(G.speed/400);
      const gain=Math.max(1,Math.floor(mult*speedMul*getCoinBonus()*(map.coinValue||1)));
      G.coins+=gain;G.totalCoins+=gain;G.stats.totalEarned+=gain;
      beep(1150+Math.min(G.combo,20)*26,0.08,'sine',0.045,1900);
    }
  }
  updateParticles(dt);
}

function handleSkinClick(cid,idx){
  const base=CHARS.find(c=>c.id===cid),sk=(base.skins||[])[idx];
  if(!sk)return;
  const ow=G.ownedSkins.includes(sk.id);
  if(ow){G.charSkins[cid]=sk.id;clearCC();markDirty();return;}
  if(sk.myth){
    const cost=sk.mythCost||1;
    if(G.mythCrystal>=cost){G.mythCrystal-=cost;G.ownedSkins.push(sk.id);G.charSkins[cid]=sk.id;clearCC();markDirty();}
    return;
  }
  if(sk.premium)return;
  if(G.totalCoins>=sk.price){G.totalCoins-=sk.price;G.ownedSkins.push(sk.id);G.charSkins[cid]=sk.id;clearCC();markDirty();}
}

function openChest(){
  if(G.wishCoins<3)return;
  G.wishCoins-=3;

  const EGG_ID='kcb_egg', TURTLE_ID='ylz_turtle';
  const hasEgg=G.ownedSkins.includes(EGG_ID);
  const hasTurtle=G.ownedSkins.includes(TURTLE_ID);

  const pool=[];
  if(!hasEgg)   pool.push({type:'skin', id:EGG_ID,    w:15});
  if(!hasTurtle)pool.push({type:'skin', id:TURTLE_ID, w:15});
  pool.push({type:'crystal', w:5});
  pool.push({type:'wish',    w:8});
  pool.push({type:'shard',   w:22});
  pool.push({type:'coin',    w:35});

  const total=pool.reduce((s,p)=>s+p.w,0);
  let r=Math.random()*total, pick=pool[pool.length-1];
  for(const p of pool){
    if(r<p.w){pick=p;break;}
    r-=p.w;
  }

  let msg='', color='#ffd93d';
  if(pick.type==='skin'){
    G.ownedSkins.push(pick.id);
    const cid = pick.id===EGG_ID ? 'kcb' : 'ylz';
    G.charSkins[cid] = pick.id;
    clearCC();
    const name = pick.id===EGG_ID ? '蛋西平' : '老鳖';
    msg='🎉 抽到限定皮肤「'+name+'」！已自动装备';
    color='#ff40c0';
    beep(880,0.14,'triangle',0.07,1300);
    setTimeout(()=>beep(1180,0.18,'triangle',0.07,1700),110);
    setTimeout(()=>beep(1560,0.22,'triangle',0.07,2100),240);
  }else if(pick.type==='crystal'){
    G.mythCrystal+=1;
    msg='💠 获得 1 神话水晶！';
    color='#ff40c0';
    beep(980,0.14,'triangle',0.06,1400);
  }else if(pick.type==='wish'){
    G.wishCoins+=1;
    msg='🪙 返还 1 心愿币';
    beep(760,0.12,'triangle',0.05,1100);
  }else if(pick.type==='shard'){
    G.mythShard+=2;
    msg='✨ 获得 2 神话碎片';
    color='#7ee0ff';
    beep(660,0.12,'triangle',0.05,950);
  }else{
    const gain=Math.floor(rand(300,800));
    G.totalCoins+=gain;
    msg='💰 获得 '+gain+' 金币';
    beep(560,0.12,'sine',0.05,900);
  }

  G.chestMsg=msg;
  G.chestMsgT=2.6;
  G.chestMsgColor=color;

  G.chestFx.push({t:0.6,max:0.6,color});
  for(let i=0;i<26;i++){

      pick.type==='skin'?'#ff40c0':(pick.type==='crystal'?'#c060ff':'#ffd93d'),rand(2,5),300);
  }

  const f=checkAchievements();
  if(f.length)G.newAch=f;
  markDirty();
}

  const y=(e.clientY-r.top)/r.height*H;

    pointerDrag.down=true;pointerDrag.startX=x;pointerDrag.startY=y;
    pointerDrag.scrollStart=G.growScroll;pointerDrag.isDragging=false;return;

  const y=(e.clientY-r.top)/r.height*H;
  const dy=y-pointerDrag.startY;

  if(pointerDrag.isDragging)G.growScroll=clamp(pointerDrag.scrollStart-dy,0,getMaxGrowScroll());

const isTouch=('ontouchstart'in window)||(window.matchMedia&&window.matchMedia('(pointer:coarse)').matches);
function syncTouchButtons(){
  if(!isTouch)return;
  const skillModes=(G.mode==='playing'||G.mode==='boss'||G.mode==='endless');
  if(G.mode==='playing'||G.mode==='boss'||G.mode==='coin'||G.mode==='endless'||G.mode==='sd'){
    btnJump.classList.add('show');
    btnSlide.classList.add('show');
    const ch=getChar();
    if(skillModes&&(ch.id==='kcb'||ch.id==='ylz'||ch.id==='zyc'||ch.id==='opl'))btnFly.classList.add('show');
    else btnFly.classList.remove('show');
  }else{
    btnJump.classList.remove('show');
    btnSlide.classList.remove('show');
    btnFly.classList.remove('show');
  }
}
function bindBtn(el,od,ou){
  el.addEventListener('pointerdown',function(e){e.stopPropagation();},{passive:false});
  if(isTouch){
    el.addEventListener('touchstart',function(e){e.preventDefault();e.stopPropagation();od();},{passive:false});
    el.addEventListener('touchend',function(e){e.preventDefault();e.stopPropagation();if(ou)ou();},{passive:false});
    el.addEventListener('touchcancel',function(e){e.preventDefault();e.stopPropagation();if(ou)ou();},{passive:false});
  } else {
    el.addEventListener('mousedown',function(e){e.preventDefault();e.stopPropagation();od();});
    el.addEventListener('mouseup',function(e){e.preventDefault();e.stopPropagation();if(ou)ou();});
    el.addEventListener('mouseleave',function(){if(ou)ou();});
  }
}
bindBtn(btnJump,function(){if(G.mode==='playing'||G.mode==='boss'||G.mode==='coin'||G.mode==='endless'||G.mode==='sd')onJumpPress();},null);
bindBtn(btnSlide,function(){if(G.mode==='playing'||G.mode==='boss'||G.mode==='coin'||G.mode==='endless'||G.mode==='sd')keys.down=true;},function(){keys.down=false;});
bindBtn(btnFly,function(){
  const ch=getChar();
  if(ch.id==='kcb')tryActivateFlight();
  else if(ch.id==='ylz')tryActivateJufei();
  else if(ch.id==='zyc')tryActivateDash();
  else if(ch.id==='opl')tryActivateSoul();
},null);
function render(){
  if(G.mode==='duel'){syncTouchButtons();renderDuel();return;}
if(G.mode==='friends'){syncTouchButtons();drawFriends();return;}
if(G.mode==='global_rank'){syncTouchButtons();drawGlobalRank();return;}
if(G.mode==='mp_lobby'){syncTouchButtons();drawMpLobby();return;}
if(G.mode==='mp_result'){syncTouchButtons();drawMpResult();return;}
  if(G.mode==='boss'||G.mode==='bossdead'){renderBoss();return;}
  if(G.mode==='coin'||G.mode==='coindone'){renderCoinRush();return;}
  if(G.mode==='sd'||G.mode==='sddead'){renderSpeedDemon();return;}
  if(G.mode==='endless'||G.mode==='endlessdead'){renderEndless();return;}
  syncTouchButtons();
  ctx.save();
  if(G.shake>0.4)ctx.translate(rand(-G.shake,G.shake),rand(-G.shake,G.shake));
  drawSky();drawHills();drawBackdrop();drawGround();
  if(G.mode!=='lobby'&&G.mode!=='shop'&&G.mode!=='map'&&G.mode!=='grow'){
    drawCoins();drawItems();
    for(const o of obstacles){
      if(o.type==='box')drawBox(o);else if(o.type==='doublebox')drawDoubleBox(o);
      else if(o.type==='spikes')drawSpikes(o);else if(o.type==='saw')drawSaw(o);
      else if(o.type==='lowbar')drawLowBar(o);
else if(o.type==='slidebar')drawSlideBar(o);else if(o.type==='drone')drawDrone(o);
      else if(o.type==='hologram')drawHologram(o);else if(o.type==='cactus')drawCactus(o);
      else if(o.type==='icicle')drawIcicle(o);else if(o.type==='fireball')drawFireball(o);
      else if(o.type==='petalwind')drawPetalWind(o);
    }
    for(const pt of portals)drawPortal(pt);
  }
  if(G.mode==='playing'||G.mode==='dead'){drawPlayer();drawGhostPlayers();drawCompanion();}
  drawJufeiShell();drawParticles();drawItemFx();drawWeatherOverlay();
  ctx.restore();
  if(G.mode==='lobby')drawLobby();
  else if(G.mode==='shop'){drawShop();if(G.skinPanel.open)drawSkinPanel();}
  else if(G.mode==='map')drawMapSelect();
  else if(G.mode==='grow')drawGrow();
  else if(G.mode==='playing')drawHUD();
  else if(G.mode==='dead'){drawHUD();drawDeadUI();}
}
let lastT=0,_lastFrame=0;
const _frameInt=PERF.frameCap>0?1000/PERF.frameCap:0;
function loop(ts){
  requestAnimationFrame(loop);
  if(_frameInt>0&&ts-_lastFrame<_frameInt-1.5)return;
  _lastFrame=ts;
  if(!lastT)lastT=ts;
  let dt=(ts-lastT)/1000;
  lastT=ts;
  if(dt>0.05)dt=0.05;
  if(dt<0)dt=0;
  update(dt);
  render();
}
requestAnimationFrame(loop);

// 启动：默认游客进入，有 token 则后台静默同步云存档
window.addEventListener('DOMContentLoaded', () => {
  const layer = document.getElementById('loginLayer');
  if (layer) layer.style.display = 'none';
  loadProgress();
  enterGame();

  const token = localStorage.getItem('wjw_token');
  const uid = localStorage.getItem('wjw_uid');
  if (token && uid) {
    syncCloudSaveSilent().catch(e => console.warn('云存档静默同步失败', e));
  }
});

async function syncCloudSaveSilent() {
  const token = localStorage.getItem('wjw_token');
  const uid = localStorage.getItem('wjw_uid');
  if (!token || !uid) return;
  currentUserId = uid;
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/saves?user_id=eq.${uid}`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${token}` }
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const rows = await res.json();
    if (Array.isArray(rows) && rows.length > 0 && rows[0].save_data) {
      applyCloudSave(rows[0].save_data);
      saveProgressOld();
    }
  } catch (err) {
    console.warn('云存档静默同步失败', err);
  }
}
})();
</script>
